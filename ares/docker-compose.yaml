
services:
  backend:
    build:
      context: ./backend
      dockerfile: dockerfile
    volumes:
      - ./backend:/app
    ports:
      - "5005:5005"

  frontend:
    build:
      context: ./frontend
      dockerfile: dockerfile
    volumes:
      - ./frontend:/app
    depends_on:
      - backend
    environment:
      BACKEND_URL: "http://backend:5005/api"
    ports:
      - "3000:3000"

networks:
  default:
    name: ares-network
